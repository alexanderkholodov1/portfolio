name: Portfolio checks and Hosting

on:
  pull_request:
  repository_dispatch:
    types: [galaxy-release, galaxy-released]
  workflow_dispatch:
    inputs:
      galaxy_tag:
        description: 'Galaxy release tag for this deploy only (empty = latest)'
        required: false
        default: ''
        type: string
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  # Tag-scoped queues for release dispatches ensure pending releases are never dropped (active-plus-two-pending).
  # Production pushes share the production queue. PRs have independent, cancellable queues.
  group: portfolio-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || (github.event_name == 'repository_dispatch' && format('dispatch-{0}', github.event.client_payload.tag) || (github.event_name == 'workflow_dispatch' && format('manual-{0}', inputs.galaxy_tag || 'latest') || (github.ref == 'refs/heads/main' && 'production' || format('branch-{0}', github.ref)))) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  site:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: write
      pull-requests: write
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      GAME_DOWNLOADS: '1'
      GITHUB_TOKEN: ${{ github.token }}
      # Public web config only: the privacy gate permits this exact key in the
      # resolved game bundle. This is not a Hosting credential.
      VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate deployment payload and event
        run: node scripts/validate-dispatch-payload.mjs
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          CLIENT_PAYLOAD_JSON: ${{ toJson(github.event.client_payload) }}
          INPUT_GALAXY_TAG: ${{ inputs.galaxy_tag }}
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Check and build the complete site
        run: pnpm run check
      - name: Require upstream release inputs for Hosting
        run: node scripts/verify-release-source.mjs
      - name: Preview same-repository PRs
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: alexanderkholodov
          channelId: pr-${{ github.event.pull_request.number }}
          expires: 7d
      - name: Verify release freshness for production deploy
        id: freshness
        run: node scripts/verify-release-freshness.mjs
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GALAXY_TAG: ${{ env.GALAXY_TAG }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy production
        if: github.ref == 'refs/heads/main' && steps.freshness.outputs.deploy == 'true' && (github.event_name == 'push' || github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch')
        uses: FirebaseExtended/action-hosting-deploy@500ac625ca2dd40cbd15f7659af953801858032a # v0.11.0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: alexanderkholodov
          channelId: live
