name: Roll back Hosting

# Restores the previous live Hosting version (the whole site, games included) with the deploy
# service account, so a rollback needs no credentials on any machine. Running it again after a
# rollback returns to the version that was live before it. Type "rollback" to confirm.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type rollback to restore the previous live Hosting version'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  rollback:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'rollback'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Write the deploy credentials outside the repository
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          umask 077
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/hosting.json"
      - name: Restore the previous live version
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/hosting.json
        run: node scripts/rollback.mjs --yes
